[workspace]
resolver = "2"
members = ["crates/octelium", "crates/octelium-apis"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/octelium/sdk-rust"
homepage = "https://octelium.com"

[workspace.dependencies]
# Kept in lockstep with crates/octelium-apis, which is generated from the
# Octelium protobuf definitions and synced into this repository by CI.
octelium-apis = { version = "0.1.0-dev", path = "crates/octelium-apis", default-features = false }
