[workspace]
resolver = "3"
members = ["crates/octelium", "crates/octelium-apis", "crates/cordium"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/octelium/sdk-rust"
homepage = "https://octelium.com"

[workspace.dependencies]
# Kept in lockstep with crates/octelium-apis, which is generated from the
# Octelium protobuf definitions and synced into this repository by CI.
# Pin the tested model layout: additive protobuf fields can change Rust struct literals.
octelium-apis = { version = "=0.1.4", path = "crates/octelium-apis", default-features = false }
